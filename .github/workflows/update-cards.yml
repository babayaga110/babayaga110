name: Update README cards

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/update-cards.yml
  schedule:
    - cron: "17 1 * * *" # once a day
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=babayaga110&show_icons=true&hide_rank=true&hide_border=true&bg_color=161B22&title_color=F0F6FC&text_color=C9D1D9&icon_color=58A6FF&card_width=495"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=babayaga110&layout=compact&langs_count=6&hide_border=true&bg_color=161B22&title_color=F0F6FC&text_color=C9D1D9&icon_color=58A6FF&card_width=495"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push

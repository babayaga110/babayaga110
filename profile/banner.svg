<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t">
  <title id="t">Karan Pandit. Full-Stack Engineer: React, Node.js, Cloud. Figma to Production. Remote-ready.</title>
  <defs>
    <clipPath id="c"><rect width="1200" height="300" rx="14"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="#58a6ff"/></pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="m"><rect x="680" width="520" height="300" fill="url(#fade)"/></mask>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="300" fill="#161b22"/>
    <rect x="680" width="520" height="300" fill="url(#dots)" mask="url(#m)" opacity=".55"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="14" fill="none" stroke="#30363d"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="118" font-size="66" font-weight="700" letter-spacing="-1" fill="#f0f6fc">Karan Pandit</text>
    <text x="66" y="170" font-size="30" font-weight="600" fill="#58a6ff">Full-Stack Engineer</text>
    <text x="66" y="218" font-size="22" fill="#c9d1d9">React  ·  Node.js  ·  Cloud</text>
    <text x="66" y="252" font-size="22" fill="#8b949e">Figma to Production  ·  Remote-ready</text>
  </g>
</svg>
